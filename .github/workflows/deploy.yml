name: edge and landing checks (optional deployment)

on:
  push:
    branches: [main]
    paths: ['edge/**', 'apps/landing/**', 'apps/www-redirect/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['edge/**', 'apps/landing/**', 'apps/www-redirect/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to your own configured Cloudflare account (requires PAKU_DEPLOY_ENABLED=true)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: edge-landing-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  edge:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKOS_CLIENT_ID: ${{ vars.PAKU_WORKOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
        working-directory: edge
      - run: npm run typecheck
        working-directory: edge
      - run: npm test
        working-directory: edge
      - run: npm run build
        working-directory: edge
      # Configure your own resources, WorkOS API key and callback before opt-in.
      - name: deploy to operator account
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && vars.PAKU_DEPLOY_ENABLED == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.WORKOS_CLIENT_ID != ''
        working-directory: edge
        run: npx wrangler deploy --var "WORKOS_CLIENT_ID:$WORKOS_CLIENT_ID" --var AUTH_MODE:workos

  landing:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test apps/landing/*.test.mjs apps/www-redirect/*.test.mjs
      - name: deploy optional static site
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && vars.PAKU_DEPLOY_ENABLED == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: apps/landing
        run: npx wrangler@4 deploy

  www-redirect:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && vars.PAKU_DEPLOY_ENABLED == 'true' && vars.PAKU_CANONICAL_ORIGIN != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CANONICAL_ORIGIN: ${{ vars.PAKU_CANONICAL_ORIGIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: deploy optional operator-owned redirect
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: apps/www-redirect
        run: npx wrangler@4 deploy --var "CANONICAL_ORIGIN:$CANONICAL_ORIGIN"
