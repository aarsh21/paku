[package]
name = "paku-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
paku-preview.workspace = true
paku-proto.workspace = true
paku-doc.workspace = true
paku-sync.workspace = true
paku-harness.workspace = true
paku-rpc.workspace = true
paku-update.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
toml = "0.8"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
nucleo-matcher.workspace = true

tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
paku-mcp.workspace = true
tokio-tungstenite.workspace = true
# In-process registry server for the two-engine workspace integration tests.
paku-sync = { workspace = true, features = ["mock-server"] }
